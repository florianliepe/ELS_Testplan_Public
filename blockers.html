<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockers Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar (Consistent with other pages) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-clipboard2-data-fill"></i> Test Plan Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-house-door"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="prep_tasks.html"><i class="bi bi-list-check"></i> Prep Tasks</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blockers.html"><i class="bi bi-cone-striped"></i> Blockers</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-person-badge"></i> Admin</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <h1><i class="bi bi-cone-striped"></i> Blockers Dashboard</h1>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-lg-3 col-md-6 mb-3"><div class="card"><div class="card-body"><h5 class="card-title">Total Blockers</h5><h4 id="total-blockers">0</h4></div></div></div>
            <div class="col-lg-3 col-md-6 mb-3"><div class="card text-white bg-danger"><div class="card-body"><h5 class="card-title">Open</h5><h4 id="open-blockers">0</h4></div></div></div>
            <div class="col-lg-3 col-md-6 mb-3"><div class="card text-dark bg-warning"><div class="card-body"><h5 class="card-title">In Progress</h5><h4 id="inprogress-blockers">0</h4></div></div></div>
            <div class="col-lg-3 col-md-6 mb-3"><div class="card text-white bg-success"><div class="card-body"><h5 class="card-title">Resolved</h5><h4 id="resolved-blockers">0</h4></div></div></div>
        </div>

        <!-- Chart -->
        <div class="card mb-4">
            <div class="card-header">Blocker Status Distribution</div>
            <div class="card-body">
                <div class="chart-wrapper" style="height:350px;">
                    <canvas id="status-pie-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Details Table -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Blocker Details</span>
                <button id="add-blocker-btn" class="btn btn-success btn-sm"><i class="bi bi-plus-circle"></i> Add New Blocker</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Blocker Name</th>
                                <th>Description</th>
                                <th>Responsible</th>
                                <th>Start Date</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th> <!-- NEW COLUMN -->
                            </tr>
                        </thead>
                        <tbody id="blockers-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Blocker Modal for Add/Edit -->
    <div class="modal fade" id="blockerModal" tabindex="-1" aria-labelledby="blockerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="blockerModalLabel">Add/Edit Blocker</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="blocker-form">
                        <input type="hidden" id="modal-blocker-index">
                        <div class="mb-3">
                            <label for="modal-blocker-name" class="form-label">Blocker Name</label>
                            <input type="text" class="form-control" id="modal-blocker-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="modal-description" class="form-label">Description</label>
                            <textarea class="form-control" id="modal-description" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modal-responsible" class="form-label">Responsible</label>
                                <input type="text" class="form-control" id="modal-responsible">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modal-start-date" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="modal-start-date">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modal-priority" class="form-label">Priority</label>
                                <select class="form-select" id="modal-priority">
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modal-status" class="form-label">Resolution Status</label>
                                <select class="form-select" id="modal-status">
                                    <option value="open">Open</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="resolved">Resolved</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="save-blocker-btn">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/blockers.js"></script>

</body>
</html>
