<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockers Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="dashboard.html">Test Plan</a>
            <a href="prep_tasks.html">Prep Tasks</a>
            <a href="blockers.html" class="active">Blockers</a>
        </div>
        <button id="clear-data-btn">Upload New File</button>
    </nav>

    <div class="container">
        <h1>Blockers Dashboard</h1>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="card">
                <div class="card-title">Total Blockers</div>
                <div class="card-value" id="total-blockers">0</div>
            </div>
            <div class="card card-open">
                <div class="card-title">Open</div>
                <div class="card-value" id="open-blockers">0</div>
            </div>
            <div class="card card-inprogress">
                <div class="card-title">In Progress</div>
                <div class="card-value" id="inprogress-blockers">0</div>
            </div>
            <div class="card card-resolved">
                <div class="card-title">Resolved</div>
                <div class="card-value" id="resolved-blockers">0</div>
            </div>
        </div>

        <!-- Chart -->
        <div class="chart-container">
            <h2>Blocker Status Distribution</h2>
            <canvas id="status-pie-chart"></canvas>
        </div>

        <!-- Filters and Details -->
        <h2>Blocker Details</h2>
        <div class="filters">
            <select id="status-filter">
                <option value="all">All Statuses</option>
            </select>
            <select id="priority-filter">
                <option value="all">All Priorities</option>
            </select>
            <input type="text" id="search-filter" placeholder="Search by name or description...">
        </div>

        <!-- Detailed Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Blocker Name</th>
                        <th>Description</th>
                        <th>Responsible</th>
                        <th>Start Date</th>
                        <th>Priority</th>
                        <th>Resolution Status</th>
                    </tr>
                </thead>
                <tbody id="blockers-table-body">
                    <!-- Rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Our custom blockers script -->
    <script src="js/blockers.js"></script>
</body>
</html>
