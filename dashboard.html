<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Plan Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-clipboard2-data-fill"></i> Test Plan Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html"><i class="bi bi-house-door"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="prep_tasks.html"><i class="bi bi-list-check"></i> Prep Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blockers.html"><i class="bi bi-cone-striped"></i> Blockers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html"><i class="bi bi-person-badge"></i> Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <!-- Summary Cards -->
        <div class="row" id="summary-cards">
            <div class="col-md-3 mb-4">
                <div class="card card-summary card-total">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title" id="total-tests">0</h5>
                                <p class="card-text">Total Tests</p>
                            </div>
                            <i class="bi bi-files"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card card-summary card-completed">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title" id="completed-tests">0</h5>
                                <p class="card-text">Completed</p>
                            </div>
                            <i class="bi bi-check2-circle"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card card-summary card-in-progress">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title" id="in-progress-tests">0</h5>
                                <p class="card-text">In Progress</p>
                            </div>
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card card-summary card-blocked">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title" id="blocked-tests">0</h5>
                                <p class="card-text">Blocked</p>
                            </div>
                            <i class="bi bi-x-octagon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        Test Status Distribution
                    </div>
                    <div class="card-body">
                        <canvas id="status-chart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        Progress Overview
                    </div>
                    <div class="card-body">
                        <canvas id="progress-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters and Actions -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    <div class="col-md-2"><select id="filter-status" class="form-select"><option value="">All Statuses</option></select></div>
                    <div class="col-md-2"><input type="date" id="filter-due-date" class="form-control"></div>
                    <div class="col-md-2"><select id="filter-responsible" class="form-select"><option value="">All People</option></select></div>
                    <div class="col-md-2"><select id="filter-location" class="form-select"><option value="">All Locations</option></select></div>
                    <div class="col-md-4"><input type="text" id="search-tests" class="form-control" placeholder="Search by test name or description..."></div>
                </div>
            </div>
        </div>

        <!-- Test Plan Details Table -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Test Plan Details</span>
                <div class="d-flex justify-content-end">
                    <button class="btn btn-primary btn-sm me-2" id="add-test-btn"><i class="bi bi-plus-circle"></i> Add Test</button>
                    <button class="btn btn-warning btn-sm me-2" id="view-all-blockers-btn"><i class="bi bi-cone-striped"></i> View All Blockers</button>
                    <button class="btn btn-info btn-sm me-2" id="import-sharepoint-btn"><i class="bi bi-cloud-arrow-down"></i> Import SharePoint</button>
                    
                    <!-- THIS IS THE NEWLY ADDED BUTTON -->
                    <button class="btn btn-success btn-sm me-2" id="export-excel-btn"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
                    
                    <button class="btn btn-secondary btn-sm" id="refresh-btn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Test</th>
                                <th>Description</th>
                                <th>Start Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Progress</th>
                                <th>Responsible</th>
                                <th>Location</th>
                                <th>Blocker</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="test-plan-table-body">
                            <!-- Rows will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Charting and Excel Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Our Custom Scripts -->
    <script src="js/export.js"></script> <!-- SCRIPT FOR EXPORT LOGIC -->
    <script src="js/dashboard.js"></script> <!-- SCRIPT FOR DASHBOARD LOGIC -->

</body>
</html>
