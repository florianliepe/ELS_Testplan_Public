<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Plan Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <nav>
        <div class="nav-logo"><i class="bi bi-clipboard2-data-fill"></i> Test Plan</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Test Plan</a>
            <a href="prep_tasks.html">Prep Tasks</a>
            <a href="blockers.html">Blockers</a>
        </div>
        <button id="clear-data-btn" class="btn btn-primary"><i class="bi bi-arrow-repeat"></i> Upload New File</button>
    </nav>

    <div class="container">
        <h1><i class="bi bi-speedometer2"></i> Test Plan Dashboard</h1>

        <div class="summary-grid">
            <div class="card">
                <div class="card-icon"><i class="bi bi-card-checklist"></i></div>
                <div class="card-content">
                    <p class="card-title">Total Tests</p>
                    <p class="card-value" id="total-tests">0</p>
                </div>
            </div>
            <div class="card card-completed">
                <div class="card-icon"><i class="bi bi-check-circle-fill"></i></div>
                <div class="card-content">
                    <p class="card-title">Completed</p>
                    <p class="card-value" id="completed-tests">0</p>
                </div>
            </div>
            <div class="card card-inprogress">
                <div class="card-icon"><i class="bi bi-hourglass-split"></i></div>
                <div class="card-content">
                    <p class="card-title">In Progress</p>
                    <p class="card-value" id="inprogress-tests">0</p>
                </div>
            </div>
            <div class="card card-blocked">
                <div class="card-icon"><i class="bi bi-x-octagon-fill"></i></div>
                <div class="card-content">
                    <p class="card-title">Blocked</p>
                    <p class="card-value" id="blocked-tests">0</p>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h2>Test Status Distribution</h2>
            <canvas id="status-pie-chart"></canvas>
        </div>

        <h2>Test Plan Details</h2>
        <div class="filters">
            <select id="status-filter"><option value="all">All Statuses</option></select>
            <select id="responsible-filter"><option value="all">All People</option></select>
            <select id="location-filter"><option value="all">All Locations</option></select>
            <input type="text" id="search-filter" placeholder="Search by test name or description...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Test</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Responsible</th>
                        <th>Location</th>
                        <th>Due Date</th>
                    </tr>
                </thead>
                <tbody id="test-plan-table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- This file must load dashboard.js -->
    <script src="js/dashboard.js"></script>
</body>
</html>
