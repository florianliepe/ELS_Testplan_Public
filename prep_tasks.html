<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Tasks Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <nav>
        <div class="nav-logo"><i class="bi bi-clipboard2-data-fill"></i> Test Plan</div>
        <div class="nav-links">
            <a href="dashboard.html">Test Plan</a>
            <a href="prep_tasks.html" class="active">Prep Tasks</a>
            <a href="blockers.html">Blockers</a>
        </div>
        <button id="clear-data-btn" class="btn btn-primary"><i class="bi bi-arrow-repeat"></i> Upload New File</button>
    </nav>

    <div class="container">
        <h1><i class="bi bi-list-check"></i> Preparation Tasks</h1>

        <div class="summary-grid">
            <div class="card">
                <div class="card-icon"><i class="bi bi-card-checklist"></i></div>
                <div class="card-content">
                    <p class="card-title">Total Tasks</p>
                    <p class="card-value" id="total-tasks">0</p>
                </div>
            </div>
            <div class="card card-completed">
                <div class="card-icon"><i class="bi bi-check-circle-fill"></i></div>
                <div class="card-content">
                    <p class="card-title">Completed</p>
                    <p class="card-value" id="completed-tasks">0</p>
                </div>
            </div>
            <div class="card card-inprogress">
                <div class="card-icon"><i class="bi bi-hourglass-split"></i></div>
                <div class="card-content">
                    <p class="card-title">In Progress</p>
                    <p class="card-value" id="inprogress-tasks">0</p>
                </div>
            </div>
            <div class="card card-blocked">
                <div class="card-icon"><i class="bi bi-x-octagon-fill"></i></div>
                <div class="card-content">
                    <p class="card-title">Blocked</p>
                    <p class="card-value" id="blocked-tasks">0</p>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h2>Task Status Distribution</h2>
            <canvas id="status-pie-chart"></canvas>
        </div>

        <h2>Preparation Task Details</h2>
        <div class="filters">
            <select id="status-filter"><option value="all">All Statuses</option></select>
            <select id="responsible-filter"><option value="all">All People</option></select>
            <input type="text" id="search-filter" placeholder="Search by title or description...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Activity Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Responsible</th>
                        <th>Due Date</th>
                        <th>Volume</th>
                    </tr>
                </thead>
                <tbody id="prep-tasks-table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- THIS IS THE FIX: It now correctly loads prep_tasks.js -->
    <script src="js/prep_tasks.js"></script>

<!-- Test Plan Modal for Add/Edit -->
<div class="modal fade" id="testPlanModal" tabindex="-1" aria-labelledby="testPlanModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="testPlanModalLabel">Add/Edit Test</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="test-plan-form">
                    <!-- Hidden input to store the index of the item being edited -->
                    <input type="hidden" id="modal-test-index">
                    
                    <div class="mb-3">
                        <label for="modal-test-name" class="form-label">Test</label>
                        <input type="text" class="form-control" id="modal-test-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="modal-test-description" class="form-label">Description</label>
                        <textarea class="form-control" id="modal-test-description" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="modal-start-date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="modal-start-date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="modal-due-date" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="modal-due-date">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="modal-status" class="form-label">Status</label>
                            <select class="form-select" id="modal-status">
                                <option value="open">Open</option>
                                <option value="in_progress">In Progress</option>
                                <option value="completed">Completed</option>
                                <option value="overdue">Overdue</option>
                                <option value="blocked">Blocked</option>
                                <option value="not_started">Not Started</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="modal-progress" class="form-label">Progress (%)</label>
                            <input type="number" class="form-control" id="modal-progress" min="0" max="100">
                        </div>
                    </div>
                     <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="modal-responsible" class="form-label">Responsible</label>
                            <input type="text" class="form-control" id="modal-responsible">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="modal-location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="modal-location">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="modal-blocker" class="form-label">Blocker</label>
                        <input type="text" class="form-control" id="modal-blocker">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="save-test-plan-btn">Save changes</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
