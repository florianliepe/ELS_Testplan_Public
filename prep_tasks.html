<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Tasks Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- ADD THIS LINE FOR THE CHARTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Your custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar (Example) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Test Plan Dashboard</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Test Plan</a></li>
                    <li class="nav-item"><a class="nav-link active" href="prep_tasks.html">Prep Tasks</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Preparation Tasks</h1>
            <!-- PASTE THIS ENTIRE BLOCK INTO prep_tasks.html -->

<!-- Overview Summary Cards -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">Total Tasks</h5>
                <h4 id="total-tasks">0</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">Completed</h5>
                <h4 id="completed-tasks">0</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5 class="card-title">In Progress</h5>
                <h4 id="in-progress-tasks">0</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-danger">
            <div class="card-body">
                <h5 class="card-title">Blocked</h5>
                <h4 id="blocked-tasks">0</h4>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row -->
<div class="row mb-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Task Status Distribution</h5>
                <canvas id="prep-status-chart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Overall Progress Overview</h5>
                <canvas id="prep-progress-chart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- The existing table should be right after this -->
            <!-- This is the button to add a new task -->
            <button id="add-new-task-btn" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Add New Task
            </button>
        </div>

        <!-- The table where data will be displayed -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Activity Title</th>
                                <th>Description</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Progress</th>
                                <th>Responsible</th>
                                <th>Blocker</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <!-- The JavaScript targets this EXACT ID -->
                        <tbody id="prep-tasks-table-body">
                            <!-- Data will be loaded here by prep_tasks.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Preparation Task Modal for Add/Edit -->
    <!-- This is the hidden pop-up form -->
    <div class="modal fade" id="prepTaskModal" tabindex="-1" aria-labelledby="prepTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="prepTaskModalLabel">Add/Edit Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="prep-task-form">
                        <input type="hidden" id="modal-task-index">
                        <div class="mb-3">
                            <label for="modal-activity-title" class="form-label">Activity Title</label>
                            <input type="text" class="form-control" id="modal-activity-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="modal-task-description" class="form-label">Description</label>
                            <textarea class="form-control" id="modal-task-description" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modal-due-date" class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="modal-due-date">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="modal-status" class="form-label">Status</label>
                                <select class="form-select" id="modal-status">
                                    <option value="not_started">Not Started</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="completed">Completed</option>
                                    <option value="overdue">Overdue</option>
                                    <option value="blocked">Blocked</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="modal-progress" class="form-label">Progress (%)</label>
                                <input type="number" class="form-control" id="modal-progress" min="0" max="100">
                            </div>
                             <div class="col-md-6 mb-3">
                                <label for="modal-responsible" class="form-label">Responsible</label>
                                <input type="text" class="form-control" id="modal-responsible">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="modal-blocker" class="form-label">Blocker</label>
                            <input type="text" class="form-control" id="modal-blocker">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="save-prep-task-btn">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- SCRIPT LOADING SECTION - THE ORDER HERE IS CRITICAL FOR THE FIX -->
    <!-- =================================================================== -->

    <!-- 1. Bootstrap JS Bundle (provides the 'bootstrap' object) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Your custom script (which USES the 'bootstrap' object) -->
    <script src="js/prep_tasks.js"></script>

</body>
</html>
