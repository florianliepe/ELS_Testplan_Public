<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Plan Dashboard - Upload</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="upload-section">
            <h1><i class="bi bi-file-earmark-arrow-up"></i> Test Plan Uploader</h1>
            <div id="upload-area" class="upload-area">
                <i class="bi bi-cloud-arrow-up-fill"></i>
                <p><strong>Drag and drop</strong> your Excel file here, or click to browse.</p>
                <input type="file" id="file-input" accept=".xlsx, .xls" hidden>
            </div>

            <div class="expected-format">
                <h3><i class="bi bi-file-earmark-spreadsheet"></i> Expected Excel Format</h3>
                <p>Your Excel file must contain sheets with the following exact names:</p>
                <ul>
                    <li><strong>Test Plan</strong></li>
                    <li><strong>Preparation Tasks</strong></li>
                    <li><strong>Blockers</strong></li>
                </ul>
                <a href="test_sample.xlsx" download class="btn btn-primary">
                    <i class="bi bi-download"></i> Download Sample Template
                </a>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
