<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Plan Uploader</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='%230D6EFD' d='M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M6.354 9.146a.5.5 0 1 1-.708.708L5.5 9.707V12.5a.5.5 0 0 1-1 0V9.707L4.354 9.854a.5.5 0 1 1-.708-.708l1.5-1.5a.5.5 0 0 1 .708 0zM8.5 12a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <div class="upload-section">
            <h1><i class="bi bi-file-earmark-arrow-up-fill"></i> Upload Test Plan Excel File</h1>
            
            <div id="upload-area" class="upload-area">
                <i class="bi bi-cloud-arrow-up"></i>
                <p><strong>Drag and drop</strong> your Excel file here, or click to browse.</p>
            </div>
            <input type="file" id="file-input" accept=".xlsx, .xls, .csv" hidden>

            <div id="upload-status" class="status-message"></div>

            <div class="expected-format">
                <h3><i class="bi bi-file-earmark-spreadsheet"></i> Expected Excel Format</h3>
                <p>Your Excel file must contain sheets with these exact names:</p>
                <ul>
                    <li><i class="bi bi-card-checklist"></i> <strong>Test Plan</strong></li>
                    <li><i class="bi bi-list-check"></i> <strong>Preparation Tasks</strong></li>
                    <li><i class="bi bi-cone-striped"></i> <strong>Blockers</strong></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- SheetJS Library for reading Excel files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Our custom script for handling the upload -->
    <script src="js/main.js"></script>
</body>
</html>
